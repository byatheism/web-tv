<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>DOC TV</title><meta name="description" content="Документальные фильмы и авторские программы по единому эфирному расписанию."><link rel="stylesheet" href="./assets/style.css?v=0.4.1"><link rel="stylesheet" href="./assets/features.css?v=0.4.0"><style>.tube #standby{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.tv:not(.on) .off-air{display:none}.panel.on-air{background:#26313d;color:#edf1f6}</style></head><body><main><header><div id="clock" class="muted"></div></header><section class="tv" id="tv" aria-label="Телевизор"><div class="tube"><img id="standby" src="./assets/standby.svg" alt="Цветные полосы" draggable="false"><div id="player"></div><div id="startup-cover" class="startup-cover" hidden aria-hidden="true"></div><div id="broadcast-fade" class="broadcast-fade" aria-hidden="true"></div><div id="ident" class="ident" hidden aria-hidden="true"><div class="ident-scan" aria-hidden="true"></div><div class="ident-inner"><div class="ident-header"><span class="ident-brand">DOC TV</span><span id="ident-time" class="ident-time"></span></div><div class="ident-rule" aria-hidden="true"></div><div class="ident-kicker">ДАЛЕЕ В ЭФИРЕ</div><span id="ident-premiere" class="ident-premiere" hidden>ПРЕМЬЕРА</span><div id="ident-title" class="ident-title"></div><div id="ident-meta" class="ident-meta"></div></div></div><div class="off-air" id="offair"><div class="slate"><span class="slate-brand">DOC TV</span><div id="slate-clock"></div><h2 id="slate-heading"></h2><p id="slate-title"></p><p id="slate-countdown"></p></div></div></div><div class="deck"><span class="brand">DOC TV</span><button id="power" title="Включить телевизор" aria-label="Включить телевизор" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.5 5.8a8 8 0 1 0 11 0"/></svg></button><div class="speaker" aria-hidden="true"></div><div class="volume" role="group" aria-label="Громкость"><button id="mute" title="Выключить звук" aria-label="Выключить звук" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5"/><path class="mute-waves" d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/><path class="mute-cross" d="m16 9 6 6m0-6-6 6"/></svg></button><div class="volume-track"><input id="volume" type="range" min="0" max="100" step="1" value="70" title="Громкость: 70%" aria-label="Громкость" disabled></div></div><button id="full" title="Полный экран" aria-label="Открыть на полный экран"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button></div></section><div id="status" role="status" aria-live="polite"></div><div class="grid"><section class="panel on-air"><h2>Сейчас в эфире</h2><p id="now"></p><p id="current-time"></p><progress id="show-progress" max="100" value="0" hidden></progress></section><section class="panel"><h2>Далее</h2><ul id="schedule"></ul></section></div></main><script type="module" src="./assets/player.js?v=0.5.2"></script></body></html>
