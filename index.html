<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Документальное телевидение</title><link rel="stylesheet" href="./assets/style.css"><style>.tube #standby{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.tv:not(.on) .off-air{display:none}.heading{display:flex;align-items:center;gap:10px;min-width:0}.about-link{font-size:16px;text-decoration:none}.panel.on-air{background:#dff5df;color:#17351e}</style></head><body><main><header><div class="heading"><h1>Документальное телевидение</h1><a class="about-link" href="./about.html" target="_blank" rel="noopener" title="О сайте" aria-label="О сайте">ⓘ</a></div><div id="clock" class="muted"></div></header><section class="tv" id="tv" aria-label="Телевизор"><div class="tube"><img id="standby" src="./assets/standby.svg" alt="Цветные полосы" draggable="false"><div id="player"></div><div class="off-air" id="offair">Эфир не запланирован</div></div><div class="deck"><span class="brand">DOC TV</span><button id="power" title="Включить телевизор" aria-label="Включить телевизор" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.5 5.8a8 8 0 1 0 11 0"/></svg></button><div class="speaker" aria-hidden="true"></div><div class="volume" role="group" aria-label="Громкость"><button id="mute" title="Выключить звук" aria-label="Выключить звук" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5"/><path class="mute-waves" d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/><path class="mute-cross" d="m16 9 6 6m0-6-6 6"/></svg></button><div class="volume-track"><input id="volume" type="range" min="0" max="100" step="1" value="70" title="Громкость: 70%" aria-label="Громкость" disabled></div></div><button id="full" title="Полный экран" aria-label="Открыть на полный экран"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button></div></section><div id="status" role="status" aria-live="polite"></div><div class="grid"><section class="panel on-air"><h2>Сейчас в эфире</h2><p id="now"></p></section><section class="panel"><h2>Далее</h2><ul id="schedule"></ul></section></div><footer id="social-links"></footer></main><script type="module" src="./assets/player.js"></script></body></html>
