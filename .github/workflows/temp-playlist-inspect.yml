name: Temporary DOC TV playlist inspection
on:
  push:
    paths:
      - '.github/workflows/temp-playlist-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -q yt-dlp
          npm install --no-save youtubei.js
      - name: Inspect playlist safely
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {Innertube} from 'youtubei.js';
          try {
            const yt=await Innertube.create({lang:'ru',location:'BY'});
            let p=await yt.getPlaylist('PLQxvgpWoAFyI');
            let count=0;
            for(let page=0;page<30&&p;page++){
              const info=p.info||{};
              console.log('PLAYLIST_META '+JSON.stringify({page,title:info.title,total_items:info.total_items,author:info.author?.name}));
              for(const v of p.videos||[]){
                const x={id:v.id,title:v.title?.text||String(v.title||''),duration:v.duration?.seconds??null,author:v.author?.name||''};
                console.log('PLAYLIST_VIDEO '+JSON.stringify(x));
                if(++count>300)throw Error('too many videos');
              }
              if(!p.has_continuation)break;
              p=await p.getContinuation();
            }
          } catch(e){console.log('INNERTUBE_ERROR '+String(e))}
          NODE
          yt-dlp --flat-playlist --dump-single-json --no-warnings --socket-timeout 20 'https://www.youtube.com/playlist?list=PLQxvgpWoAFyI' > /tmp/playlist.json || true
          python - <<'PY'
          import json
          try:
            d=json.load(open('/tmp/playlist.json'))
            print('YTDLP_META '+json.dumps({'title':d.get('title'),'uploader':d.get('uploader'),'entries_count':len(d.get('entries') or [])},ensure_ascii=False))
            for i,x in enumerate(d.get('entries') or []):
              print('YTDLP_VIDEO '+json.dumps({'index':i+1,'id':x.get('id'),'title':x.get('title'),'duration':x.get('duration'),'uploader':x.get('uploader')},ensure_ascii=False))
          except Exception as e: print('YTDLP_ERROR '+str(e))
          PY
