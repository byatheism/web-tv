name: Temporary YouTube metadata

on:
  push:
    paths:
      - '.github/workflows/youtube-meta-temp.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core
      - name: Read duration from YouTube player
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import {execSync} from 'node:child_process';
          import http from 'node:http';

          let chrome='';
          for(const cmd of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){
            try{chrome=execSync('which '+cmd,{encoding:'utf8'}).trim();if(chrome)break;}catch{}
          }
          if(!chrome)throw new Error('Chrome not found');

          let currentId='';
          const server=http.createServer((req,res)=>{
            res.writeHead(200,{'content-type':'text/html; charset=utf-8','referrer-policy':'strict-origin-when-cross-origin'});
            res.end(`<!doctype html><html><head><meta name="referrer" content="strict-origin-when-cross-origin"></head><body><div id="p"></div><script>
              window.done=null;
              window.onYouTubeIframeAPIReady=()=>{
                const p=new YT.Player('p',{
                  videoId:'${currentId}',
                  playerVars:{controls:0,playsinline:1,origin:'http://127.0.0.1:8765'},
                  events:{
                    onReady:()=>setTimeout(()=>{window.done={duration:p.getDuration(),title:p.getVideoData()?.title||null,state:p.getPlayerState()}},2500),
                    onError:e=>{window.done={error:e.data}}
                  }
                });
              };
            </script><script src="https://www.youtube.com/iframe_api"></script></body></html>`);
          });
          await new Promise(r=>server.listen(8765,'127.0.0.1',r));

          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']});
          for(const id of ['-l5VY9ifsfc','ZQ9uKxsArxw']){
            currentId=id;
            const page=await browser.newPage();
            await page.setExtraHTTPHeaders({'referer':'http://127.0.0.1:8765/'});
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            try{
              await page.waitForFunction(()=>window.done!==null,{timeout:30000});
              console.log('META '+JSON.stringify({id,...await page.evaluate(()=>window.done)}));
            }catch(e){
              console.log('META '+JSON.stringify({id,error:String(e)}));
            }
            await page.close();
          }
          await browser.close();
          server.close();
          NODE
