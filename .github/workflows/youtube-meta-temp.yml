name: Temporary YouTube metadata

on:
  push:
    paths:
      - '.github/workflows/youtube-meta-temp.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Probe page metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          for(const id of ['-l5VY9ifsfc','ZQ9uKxsArxw']){
            const out={id};
            for(const path of ['watch?v='+id,'embed/'+id]){
              try{
                const r=await fetch('https://www.youtube.com/'+path,{headers:{'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','accept-language':'ru,en;q=0.8'}});
                const html=await r.text();
                const lengths=[...html.matchAll(/"lengthSeconds":"?(\d+)"?/g)].map(m=>Number(m[1]));
                const approx=[...html.matchAll(/"approxDurationMs":"?(\d+)"?/g)].map(m=>Math.round(Number(m[1])/1000));
                out[path.startsWith('watch')?'watch':'embed']={status:r.status,bytes:html.length,lengths:[...new Set(lengths)].slice(0,10),approx:[...new Set(approx)].slice(0,10)};
              }catch(e){out.error=String(e)}
            }
            console.log('META '+JSON.stringify(out));
          }
          NODE
