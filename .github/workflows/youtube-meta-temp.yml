name: Temporary YouTube metadata

on:
  push:
    paths:
      - '.github/workflows/youtube-meta-temp.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp
      - name: Read durations
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          ids=['-l5VY9ifsfc','ZQ9uKxsArxw']
          for vid in ids:
              out={'id':vid}
              for client in ('web_embedded','tv_embedded','android_vr','web','android'):
                  p=subprocess.run([
                      'yt-dlp','--dump-single-json','--skip-download','--no-playlist',
                      '--extractor-args',f'youtube:player_client={client}',
                      f'https://www.youtube.com/watch?v={vid}'
                  ],capture_output=True,text=True)
                  if p.returncode==0:
                      try:
                          d=json.loads(p.stdout)
                          out.update(client=client,title=d.get('title'),duration=d.get('duration'))
                          break
                      except Exception:
                          pass
              print('META '+json.dumps(out,ensure_ascii=False))
          PY
