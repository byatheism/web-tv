name: Temporary YouTube metadata

on:
  push:
    paths:
      - '.github/workflows/youtube-meta-temp.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public metadata mirrors
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, ssl
          ids=["s7XSvMjYdf4","Lert9K_4VjU"]
          endpoints=[
            ("piped-adminforge","https://pipedapi.adminforge.de/streams/{id}"),
            ("piped-really","https://pipedapi.reallyaweso.me/streams/{id}"),
            ("piped-leptons","https://pipedapi.leptons.xyz/streams/{id}"),
            ("invidious-yewtu","https://yewtu.be/api/v1/videos/{id}"),
            ("invidious-nadeko","https://inv.nadeko.net/api/v1/videos/{id}")
          ]
          for vid in ids:
            found=False
            for name,tpl in endpoints:
              try:
                req=urllib.request.Request(tpl.format(id=vid),headers={"User-Agent":"Mozilla/5.0"})
                with urllib.request.urlopen(req,timeout=15,context=ssl.create_default_context()) as r:
                  d=json.load(r)
                out={"id":vid,"source":name,"title":d.get("title"),"duration":d.get("duration")}
                if out["duration"] is None:
                  out["duration"]=d.get("lengthSeconds")
                print("MIRROR",json.dumps(out,ensure_ascii=False))
                if out["duration"]:
                  found=True
                  break
              except Exception as e:
                print("MIRROR_ERR",json.dumps({"id":vid,"source":name,"error":str(e)[:150]},ensure_ascii=False))
            if not found:
              print("MIRROR_NONE",vid)
          PY
