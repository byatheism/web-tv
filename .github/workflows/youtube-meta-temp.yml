name: Temporary YouTube metadata

on:
  push:
    paths:
      - '.github/workflows/youtube-meta-temp.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect duration hints
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          for(const id of ['-l5VY9ifsfc','ZQ9uKxsArxw']){
            const r=await fetch('https://www.youtube.com/watch?v='+id,{headers:{'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','accept-language':'ru,en;q=0.8'}});
            const html=await r.text();
            const out={id};
            for(const key of ['lengthText','duration','lengthSeconds','approxDurationMs','videoDetails']){
              const i=html.indexOf(key);
              out[key]=i<0?null:html.slice(Math.max(0,i-180),Math.min(html.length,i+420)).replace(/\s+/g,' ');
            }
            const iso=[...html.matchAll(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/g)].slice(0,20).map(m=>m[0]);
            out.iso=[...new Set(iso)];
            console.log('META '+JSON.stringify(out));
          }
          NODE
