name: Temporary YouTube metadata

on:
  push:
    paths:
      - '.github/workflows/youtube-meta-temp.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save youtubei.js
      - name: Read metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { Innertube } from 'youtubei.js';
          const yt=await Innertube.create({lang:'ru',location:'BY'});
          for(const id of ['-l5VY9ifsfc','ZQ9uKxsArxw']){
            let out={id};
            try{
              const info=await yt.getBasicInfo(id);
              const b=info.basic_info||{};
              out.title=b.title??null;
              out.duration=b.duration??null;
              out.channel=b.channel?.name??b.author??null;
            }catch(e){out.error=String(e)}
            if(!out.title){
              try{
                const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
                if(r.ok){const d=await r.json();out.title=d.title??out.title;out.channel=d.author_name??out.channel;}
              }catch{}
            }
            console.log('META '+JSON.stringify(out));
          }
          NODE
