name: Temporary YouTube metadata

on:
  push:
    paths:
      - '.github/workflows/youtube-meta-temp.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Probe YouTube player API clients
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const ids=["s7XSvMjYdf4","Lert9K_4VjU"];
          const key='AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8';
          const clients=[
            {name:'ANDROID',body:{clientName:'ANDROID',clientVersion:'19.29.37',androidSdkVersion:30,hl:'ru',gl:'BY'}},
            {name:'TVHTML5',body:{clientName:'TVHTML5',clientVersion:'7.20240909',hl:'ru',gl:'BY'}},
            {name:'WEB',body:{clientName:'WEB',clientVersion:'2.20240909.01.00',hl:'ru',gl:'BY'}}
          ];
          for(const id of ids){
            for(const c of clients){
              try{
                const r=await fetch('https://www.youtube.com/youtubei/v1/player?key='+key,{
                  method:'POST',
                  headers:{'content-type':'application/json','user-agent':'Mozilla/5.0'},
                  body:JSON.stringify({context:{client:c.body},videoId:id,contentCheckOk:true,racyCheckOk:true})
                });
                const d=await r.json();
                console.log('PLAYER '+JSON.stringify({
                  id,client:c.name,http:r.status,status:d.playabilityStatus?.status??null,
                  reason:d.playabilityStatus?.reason??null,
                  title:d.videoDetails?.title??null,
                  duration:d.videoDetails?.lengthSeconds?Number(d.videoDetails.lengthSeconds):null
                }));
                if(d.videoDetails?.lengthSeconds)break;
              }catch(e){console.log('PLAYER_ERR '+JSON.stringify({id,client:c.name,error:String(e)}));}
            }
          }
          NODE
