name: Temporary YouTube metadata

on:
  push:
    paths:
      - '.github/workflows/youtube-meta-temp.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save youtubei.js
      - name: Read compact metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { Innertube } from 'youtubei.js';
          const yt = await Innertube.create({ lang: 'ru', location: 'BY' });
          const ids = ["VhcmoJ12DPY","XMSE-zjwD0U","oI-_W1ALo2E","nZr1oqL0oZk","HHfbkvi7iL4","u5D6EthTzfU","WT6NDRRTe9c","nOMerAkjKMg","s7XSvMjYdf4","4lMr52pFzBU","oUNCVamhVd0","3NyJcejlW3o","qiSefk2kf0Y","kJ-aTW_nDwg","BDYTcWkFcu0","kS2t0kvIMmw","Lert9K_4VjU","aosi2biz3pY","N-5imv3PHDw","t9JqD4F3X4A","NNH6HjmHZzw","ej9yIH_-TEk"];
          for (const id of ids) {
            let title=null,duration=null,channel=null,error=null;
            try {
              const info=await yt.getBasicInfo(id);
              const b=info.basic_info||{};
              title=b.title??null;
              duration=b.duration??null;
              channel=b.channel?.name??b.author??null;
            } catch(e){error=String(e)}
            if(!title){
              try{
                const url='https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id);
                const r=await fetch(url);
                if(r.ok){const d=await r.json();title=d.title??title;channel=d.author_name??channel;}
              }catch(e){error=(error?error+' | ':'')+String(e)}
            }
            console.log('META '+JSON.stringify({id,title,duration,channel,error}));
          }
          NODE
