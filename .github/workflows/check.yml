name: Check programme and player logic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/schedule.js
      - run: node --check assets/player.js
      - run: npm test
      - run: npm run check
