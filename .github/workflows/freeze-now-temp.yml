name: Temporary freeze now

on:
  push:
    paths:
      - '.github/workflows/freeze-now-temp.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/freeze-programme.js
      - run: npm test
      - run: npm run check
      - name: Commit programme
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/fixed-schedule.json)" ]; then
            echo "No fixed programme changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixed-schedule.json
          git commit -m "Update fixed hourly programme"
          git pull --rebase
          git push
